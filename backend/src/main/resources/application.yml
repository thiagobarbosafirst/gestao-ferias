server:
  port: 8080

spring:
  application:
    name: gestao-ferias
  datasource:
    # Valores por omissão para correr localmente (IntelliJ). No Docker são substituídos por variáveis de ambiente.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ferias}
    username: ${DB_USER:ferias}
    password: ${DB_PASSWORD:ferias}
  jpa:
    # O esquema é gerido pelo Flyway (src/main/resources/db/migration), não pelo Hibernate.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

app:
  jwt:
    # Segredo HMAC (mínimo 32 caracteres). Em produção deve vir de uma variável de ambiente.
    secret: ${JWT_SECRET:troque-este-segredo-por-um-valor-longo-e-aleatorio-123456}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  # Cria utilizadores e pedidos de exemplo no primeiro arranque (base de dados vazia).
  seed-data: ${SEED_DATA:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
